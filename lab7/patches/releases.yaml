# lab7 — patches for Kustomization `releases` (bootstrap/flux.tf).
#
# Applied after the upstream artifact (pinned to 0.11.33) is built. Nothing here
# is published.
#
# ── Removed: components the lab does not use and the cluster cannot run ──────
#
# ngrok      Domain/AgentEndpoint consume the ngrok CRDs removed in
#            patches/crds.yaml — they cannot be applied without them.
# triage     triage-agent/-core pull private GHCR packages; pages-triage and
#            graph-otel-demo (despite the name) live in ns `triage` and pull
#            with the private `triage-ghcr-pull` Secret. They stay red forever
#            and keep `releases` from ever becoming Ready.
# xray-memory  needs the author's snapshot key. Same effect.
# llm-d      not blocking, but unused: qdrant-mcp embeds through
#            llama-cpp-embeddings, not llm-d. Frees memory and two large image
#            pulls that tend to outlast the Helm timeout.
#
# 🔴 triage.yaml ALSO declares `Namespace flux-system` (to carry a tenant
# annotation). It is deliberately NOT listed here. Every Namespace target below
# names its namespace — never target by `kind: Namespace` alone, or Flux's own
# namespace goes with it.
#
# Generated from releases/ at tag v0.11.33 — if the pin moves, re-check names.

